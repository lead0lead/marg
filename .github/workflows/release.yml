name: Release

# A tag vX.Y.Z on main builds the Linux binary, the Windows .exe and the
# macOS app (Apple Silicon, zipped marg.app) with the dist profile and attaches them to a GitHub release. The tag must
# match the version in Cargo.toml. Run by hand (Actions → Release → Run
# workflow) to build the binaries as artifacts without a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: marg
            asset: marg-linux-x86_64
          - os: windows-latest
            binary: marg.exe
            asset: marg-windows-x86_64.exe
          - os: macos-latest
            binary: marg
            asset: marg-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Test
        run: cargo test --workspace
      - name: Build
        shell: bash
        run: cargo build --profile dist -p marg 2>&1 | tee build.log
      # Debug builds on Windows warn about mixed C runtimes (concept §12);
      # release builds should not.
      - name: Check for C runtime conflicts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if grep -q LNK4098 build.log; then
            echo "::warning::LNK4098 (C runtime conflict) in the release build"
          fi
      - name: Rename
        if: runner.os != 'macOS'
        shell: bash
        run: cp "target/dist/${{ matrix.binary }}" "${{ matrix.asset }}"
      # ditto keeps the ad hoc signature and the bundle's attributes.
      - name: Bundle marg.app
        if: runner.os == 'macOS'
        run: |
          scripts/make-app.sh target/dist/marg bundle
          ditto -c -k --keepParent bundle/marg.app "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" --title "marg $GITHUB_REF_NAME" --generate-notes
