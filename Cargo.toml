[workspace]
resolver = "3"
members = ["crates/marg-core", "crates/marg-pdf", "crates/marg"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
marg-core = { path = "crates/marg-core" }
marg-pdf = { path = "crates/marg-pdf" }
mupdf = { version = "0.8.0", default-features = false, features = ["base14-fonts"] }
eframe = "0.37.0"
log = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
directories = "6"
simplelog = { version = "0.12", default-features = false }
# Same version and a subset of the features egui uses: only checks font files.
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
